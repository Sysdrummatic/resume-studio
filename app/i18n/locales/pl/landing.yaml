landing:
  hero:
    title: Stwórz swoje idealne LiveCV,
    title_prefix: które
    title_suffix: razem z Tobą.
    rotating_words:
      - rośnie
      - ewoluuje
      - adaptuje się
      - rozwija się
    description:
      - Klasyczne CV jest nieaktualne zaraz po jego publikacji. Każda najmniejsza zmiana powoduje, że musisz wygenerować kolejny plik. A co jeśli twoje doświadczenie zawodowe umożliwia Ci aplikowanie na trzy odrębne ścieżki kariery? Kończysz z trzema osobnymi edytowalnymi wersjami i dokumentami dopasowanymi pod konkretne oferty. 
      - OpenCiVera pozwala Ci stworzyć jedno uporządkowane źródło danych, z którego wybierasz treści do osobnych LiveCV. Każde z nich publikujesz pod własnym linkiem, a gdy dodasz nowe doświadczenia, publikujesz je ponownie. Jeżeli będziesz potrzebować wersji w PDF, możesz ją pobrać w dowolnym momencie.
      - Platforma jest darmowa, a Twoje dane pozostają prywatne. Publikujesz tylko to, co chcesz pokazać.
    primary_action: Utwórz LiveCV
    secondary_action: Zobacz przykładowe LiveCV
    lead: OpenCiVera pozwala Ci stworzyć jedno uporządkowane źródło danych, z którego wybierasz treści do osobnych LiveCV. Każde z nich publikujesz pod własnym linkiem, a gdy dodasz nowe doświadczenia, publikujesz je ponownie.
    free_note: "Całkowicie bezpłatnie: bez paywalli i ukrytych opłat."
  story:
    aria_label: Jak działa OpenCiVera
    rail_label: Etapy
    short_screen:
      title: Ta historia potrzebuje więcej miejsca.
      text: Treść strony jest zaprojektowana dla okien o wysokości większej niż 560 px. Powiększ okno, aby otworzyć pełnowartościową animację.
      action: Pokaż wersję uproszczoną
    next: Przewiń
    back: Wróć
    faq: FAQ
    formats_label: Formaty eksportu
    start_label: Start
    stages:
      - id: livecv
        label: LiveCV?
        title: LiveCV to Twoje CV jako strona pod linkiem.
        body: Zamiast pliku wysyłasz adres. Rekruter otwiera Twoje CV w przeglądarce, a nową wersję publikujesz wtedy, kiedy chcesz, bez rozsyłania kolejnych plików. Jeśli potrzebujesz, pobierasz też PDF.
      - id: base
        label: Baza doświadczeń
        title: Najpierw zbierasz wszystko w Bazie doświadczeń.
        body: Role, kursy, umiejętności i osiągnięcia zapisujesz raz, w jednym prywatnym miejscu. Możesz zacząć od importu obecnego CV.
      - id: pick
        label: Wybór
        title: Wybierasz to, co pasuje do roli.
        body: Z bazy wybierasz treści do osobnego LiveCV dopasowanego do konkretnej oferty. Pełna historia zostaje w bazie.
      - id: ready
        label: Gotowe LiveCV
        title: Z wybranych wpisów tworzysz swoje LiveCV.
        body: Publikujesz je pod własnym linkiem i wysyłasz adres zamiast kolejnego pliku.
      - id: versions
        label: Wersje
        title: Z tej samej bazy tworzysz kolejne wersje.
        body: Każda wersja ma własny link, wybór treści i język, więc dopasujesz ją do konkretnej oferty.
      - id: history
        label: Historia
        title: Historia publikacji Twojego LiveCV.
        body: Każda publikacja zapisuje opublikowany stan LiveCV, do którego możesz wrócić. Edycja bazy nie zmienia już opublikowanego LiveCV, dopóki nie opublikujesz go ponownie.
      - id: feats
        label: Funkcje
        title: Funkcje OpenCiVera
        body: Żadnych paywalli, otwarty import i eksport danych w różnych formatach, zgodność z RODO i pełna kontrola nad tym, co udostępniasz.
      - id: go
        label: Do dzieła!
        title: Twoje LiveCV jako publiczna wizytówka.
        body: Opublikowane LiveCV jest dostępne pod publicznym linkiem. Rekruterzy i współpracownicy otwierają je w przeglądarce, a Ty decydujesz, które informacje udostępnić.

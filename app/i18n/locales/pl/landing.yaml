        chip: PDF / DOCX / YAML / TXT
        title: Zacznij od obecnego CV
        description: Szybki start z importem danych z pliku PDF, DOCX, YAML lub TXT. Sprawdź odczytane informacje i uzupełnij brakujące dane w formularzu.
      - tag: LiveCV
        chip: Publiczny link
        title: Udostępnij LiveCV
        description: Opublikuj wybrane treści pod linkiem dla rekrutera lub pobierz gotowy plik.
      - tag: Eksport
        chip: PDF / YAML / TXT
        title: Pobierz swoje CV w różnych formatach
        description: W każdej chwili możesz pobrać swoje LiveCV w formacie PDF, YAML lub TXT. Możesz też eksportować uporządkowane dane z Bazy doświadczeń i wykorzystać je ponownie.
      - tag: Dopasowane wersje
        chip: Wiele LiveCV
        title: Wybierz to, co pasuje do roli
        description: Każde LiveCV może mieć własne podsumowanie, wybór doświadczeń, umiejętności i wygląd. Pełna historia zawodowa pozostaje w bazie.
      - tag: Języki
        chip: EN / PL
        title: Twoje doświadczenie w kilku językach
        description: Prowadź osobne wersje językowe i wybierz, które opublikować. Dzięki temu jedno LiveCV może być dostępne w językach które znasz. Z opublikowanego LiveCV możesz też pobrać plik PDF w wybranym języku.
      - tag: Prywatność
        chip: Twoja decyzja
        title: Pełna historia pozostaje prywatna
        description: Zawartość Bazy doświadczeń pozostaje prywatna. Udostępniasz tylko to, co chcesz pokazać w LiveCV. W każdej chwili możesz wyłączyć publiczny link.
      - tag: Aktualizacje
        chip: Kontrola publikacji
        title: Odśwież wybraną wersję
        description: Dodawaj nowe osiągnięcia bez zmieniania wcześniej opublikowanych LiveCV. Gdy wybrana wersja będzie gotowa do udostępnienia, opublikuj ją ponownie.
      - tag: CV-as-Code
        chip: Twoje CV to kod
        title: Ustrukturyzowana treść w formacie YAML
        description: Twoje LiveCV i Baza doświadczeń są zapisane w formacie YAML. Dzięki temu w łatwy sposób możesz pobrać swoje dane i wykorzystać je w innych narzędziach.
      - tag: CLM
        chip: CV Lifecycle Management
        title: Zarządzanie historią wersji CV
        description: OpenCiVera pozwala Ci na zarządzanie historią wersji LiveCV. Każda publikacja jest zapisywana, a Ty możesz w każdej chwili przywrócić poprzednią wersję.
      - tag: RODO
        chip: Twoje dane są bezpieczne
        title: Zgodność z RODO
        description: Twoje dane pozostają prywatne. OpenCiVera nie udostępnia ich osobom trzecim. W każdej chwili możesz pobrać swoje dane i usunąć konto.
  faq:
    title: Odpowiedzi na najczęściej zadawane pytania.
    items:
      - question: Co to jest LiveCV?
        answer: LiveCV to Twoje CV w formie strony dostępnej z publicznego linku. Link możesz udostępnić każdemu, kto będzie chciał zobaczyć twoje LiveCV.
      - question: Czym OpenCiVera różni się od zwykłego kreatora CV?
        answer: Zwykły kreator pomaga przygotować pojedynczy dokument. W OpenCiVera najpierw tworzysz prywatną Bazę doświadczeń, a następnie wybierasz z niej treści do osobnych LiveCV dopasowanych do konkretnych ofert.
      - question: Czy mogę pobrać moje LiveCV w formacie PDF?
        answer: Tak. W każdej chwili możesz pobrać swoje LiveCV w formacie PDF, YAML lub TXT.  
      - question: Czy korzystanie z OpenCiVera jest płatne?
        answer: Nie. OpenCiVera jest całkowicie darmowa. Nie ma żadnych paywalli ani ukrytych opłat.
      - question: Czy muszę przepisać moje obecne CV?
        answer: Nie. Możesz zaimportować plik PDF, DOCX, YAML lub TXT, sprawdzić odczytane informacje i uzupełnić brakujące dane.
      - question: Czy muszę znać YAML?
        answer: Nie. LiveCV możesz uzupełniać za pomocą zwykłego formularza. YAML jest techniczną podstawą danych i pozostaje dostępny dla osób, które chcą mieć nad nimi dodatkową kontrolę.
      - question: Kto może zobaczyć moją Bazę doświadczeń?
        answer: Baza doświadczeń jest prywatna. Odbiorca publicznego linku widzi tylko informacje wybrane do konkretnego, opublikowanego LiveCV.
      - question: Jak działa publikacja?
        answer: Baza doświadczeń pozostaje prywatna. Wybierasz treści do LiveCV, a następnie świadomie je publikujesz. Edycja bazy nie zmienia już opublikowanego LiveCV. Gdy chcesz udostępnić nowe informacje, publikujesz wybraną wersję ponownie. Publiczny link możesz w każdej chwili wyłączyć.
      - question: Czy zmiana danych aktualizuje opublikowane LiveCV?
        answer: Nie. Edycja Bazy doświadczeń nie zmienia automatycznie publikacji. Aby udostępnić nowe informacje, ponownie publikujesz wybraną wersję LiveCV.
      - question: Czy mogę utworzyć kilka wersji LiveCV?
        answer: Tak. Możesz przygotować osobne wersje dla różnych stanowisk, ofert i języków, korzystając z tej samej Bazy doświadczeń.
      - question: Czy OpenCiVera jest zgodna z RODO?
        answer: Tak. Twoje dane pozostają prywatne. OpenCiVera nie udostępnia ich osobom trzecim. W każdej chwili możesz pobrać swoje dane i usunąć konto.


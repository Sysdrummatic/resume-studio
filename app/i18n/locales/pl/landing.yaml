      - tag: Baza doświadczeń
        chip: Jedno źródło wiedzy
        title: Twoja kariera w jednym miejscu
        description: Zbierz i aktualizuj swoje doświadczenia zawodowe, umiejętności i osiągnięcia w jednym miejscu. Baza doświadczeń pozostaje prywatna, a Ty decydujesz, które informacje udostępnić w LiveCV.

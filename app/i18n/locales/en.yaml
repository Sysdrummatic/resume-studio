landing:
  hero:
    eyebrow: // LiveCV publication platform
    title_before: Create your ultimate LiveCV.
    title_connector: Which
    title_after: with you.
    rotating_words:
      - grows
      - evolves
      - adapts
      - scales
    lead:
      - Managing your CV is broken. One version for this job, another for that role, then translations, and six months later nobody knows which PDF a recruiter has.
      - OpenCiVera fixes that. Build your career record once, publish a tailored version for each audience, and update all of them the instant anything changes.
    primary_action: Create LiveCV
    secondary_action: View sample LiveCV
    benefits:
      - One master CV
      - Multiple configurations
      - LiveCV always up-to-date
  sample:
    eyebrow: // public link in action
    title: Your CV as your public business card.
    description: The output layer is a clean structured view, designed for professional signal, not document formatting. This is what recipients see when they open your link.
    loading_aria: Loading sample resume
    open_aria: Open sample resume
    iframe_title: Sample public resume — OpenCiVera
    timeout: The embedded preview is taking longer than expected. You can still explore the platform by viewing the full example.
    timeout_action: Open sample resume ↗
  model:
    eyebrow: // CV as Code model
    title: Focus on your career record.
    description: Manage your career information in one structured, consistent record. Don't think about layout or fitting your data to a given template. Edit YAML or use the editor, and leave the rest to us.
    cards:
      - tag: master resume
        chip: 1 record
        chip_type: t
        title: One structured career record
        copy: Maintain one authoritative source instead of managing disconnected CV files that diverge every time you apply.
      - tag: publication path
        chip: Multi-view
        chip_type: a
        title: Shape different public narratives
        copy: Present distinct professional profiles for different audiences without fragmenting your underlying source data.
      - tag: locale-aware output
        chip: EN / PL
        chip_type: t
        title: Language-specific delivery
        copy: Preserve locale-appropriate presentation while keeping the publishing model coherent and the source unified.
  cta:
    eyebrow: // get started
    title: Build your LiveCV with OpenCiVera.
    description: Open the sample LiveCV to see a published link in action, then sign in and build your own from one structured source.
    primary_action: Create LiveCV
    secondary_action: View sample LiveCV ↗
  footer:
    sample_resume: Sample resume
    platform: Platform
    privacy_policy: Privacy Policy
    terms: Terms of Service
    contact: Contact

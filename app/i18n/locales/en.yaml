    open_aria: Open sample resume
    iframe_title: Sample public resume — OpenCiVera
    timeout: The embedded preview is taking longer than expected. You can still explore the platform by viewing the full example.
    timeout_action: Open sample resume ↗
  benefits:
    aria_label: Key OpenCiVera capabilities
    items:
      - One record of all your experience
      - Versions tailored to each application
      - CVs in different languages
  animation:
    title: From your whole story to the right CV.
    description: See how your experience moves into a private Master Resume and then into versions tailored to specific roles.
    iframe_title: Animation showing how OpenCiVera creates tailored CVs
  how:
    title: Less time managing files. More room to grow.
    description: A simple way to organise what you already know and show what matters right now.
    features:
      - icon: file
        title: All your experience. One place.
        description: Stop looking for achievements in old files. Keep your story in Master Resume and add to it as your career develops.
      - icon: layers
        title: The right story for the right role.
        description: Choose relevant experience and a summary. Save a separate CV for each career path using the same source record.
      - icon: link
        title: Ready to share. On your terms.
        description: Publish a selected version and send the link. You decide when later edits appear there and when the link is no longer available.
  privacy:
    title: Your whole career is yours. You share a selected part.
    description: Your Master Resume stays private. A public link shows only the content you selected and published. You can deactivate it whenever you want.
    action: About publishing
  faq:
    title: Good to know before you start.
    items:
      - question: Can I use a CV I already have?
        answer: Yes. The editor supports PDF, DOCX, YAML and TXT imports. You review the content before saving it to your career record.
      - question: Who can see my Master Resume?
        answer: Your Master Resume is private. A public link recipient sees only the content selected for the published CV version.
      - question: Does editing change a CV I have already shared?
        answer: Not immediately. Saving edits does not change a publication. Publish the selected version again for link recipients to see the new content.
      - question: Can I create language versions?
        answer: Yes. You can maintain CV content in different languages and choose the languages of a saved version. You provide the content for each language separately.

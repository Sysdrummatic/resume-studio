  hero:
    title:
      - Your experience
      - deserves a
      - good introduction.
    description: A CV that is easy to prepare, tailor and share. Take care of your career story — from the first draft to your next opportunity.
    primary_action: Create your CV
    secondary_action: See a sample CV
    privacy_note: Your career record stays private.

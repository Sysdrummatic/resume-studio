landing:
  hero:
    eyebrow: // platforma publikacji LiveCV
    title_before: Stwórz swoje docelowe LiveCV.
    title_connector: Które
    title_after: razem z Tobą.
    rotating_words:
      - rośnie
      - ewoluuje
      - adaptuje się
      - skaluje się
    lead:
      - Zarządzanie CV jest niepotrzebnie skomplikowane. Jedna wersja do tej pracy, druga do innej roli, później tłumaczenia, a po sześciu miesiącach nikt nie wie, który PDF ma rekruter.
      - OpenCiVera to porządkuje. Zbuduj swój profil zawodowy raz, publikuj dopasowane wersje dla różnych odbiorców i aktualizuj je wszystkie, gdy tylko coś się zmieni.
    primary_action: Utwórz LiveCV
    secondary_action: Zobacz przykładowe LiveCV
    benefits:
      - Jedno główne CV
      - Wiele konfiguracji
      - LiveCV zawsze aktualne
  sample:
    eyebrow: // publiczny link w praktyce
    title: Twoje CV jako publiczna wizytówka.
    description: Warstwa publikacji to przejrzysty, uporządkowany widok skupiony na doświadczeniu zawodowym, a nie na formatowaniu dokumentu. To właśnie widzą odbiorcy po otwarciu Twojego linku.
    loading_aria: Ładowanie przykładowego CV
    open_aria: Otwórz przykładowe CV
    iframe_title: Przykładowe publiczne CV — OpenCiVera
    timeout: Osadzony podgląd ładuje się dłużej niż zwykle. Nadal możesz poznać platformę, otwierając pełny przykład.
    timeout_action: Otwórz przykładowe CV ↗
  model:
    eyebrow: // model CV as Code
    title: Skup się na swojej historii zawodowej.
    description: Zarządzaj informacjami o karierze w jednym uporządkowanym i spójnym źródle. Nie przejmuj się układem ani dopasowywaniem danych do szablonu. Edytuj YAML lub użyj edytora, a resztę zostaw nam.
    cards:
      - tag: główne CV
        chip: 1 rekord
        chip_type: t
        title: Jedno uporządkowane źródło kariery
        copy: Utrzymuj jedno wiarygodne źródło zamiast wielu oddzielnych plików CV, które rozchodzą się przy każdej aplikacji.
      - tag: ścieżka publikacji
        chip: Wiele widoków
        chip_type: a
        title: Twórz różne narracje zawodowe
        copy: Prezentuj odrębne profile zawodowe różnym odbiorcom bez dzielenia bazowych informacji na osobne dokumenty.
      - tag: wersje językowe
        chip: PL / EN
        chip_type: t
        title: Publikuj we właściwym języku
        copy: Zachowaj prezentację odpowiednią dla danego języka, nie tracąc spójnego modelu publikacji i jednego źródła danych.
  cta:
    eyebrow: // zacznij teraz
    title: Zbuduj swoje LiveCV z OpenCiVera.
    description: Otwórz przykładowe LiveCV, aby zobaczyć publiczny link w praktyce, a następnie zaloguj się i zbuduj własne CV z jednego uporządkowanego źródła.
    primary_action: Utwórz LiveCV
    secondary_action: Zobacz przykładowe LiveCV ↗
  footer:
    sample_resume: Przykładowe CV
    platform: Platforma
    privacy_policy: Polityka prywatności
    terms: Regulamin
    contact: Kontakt

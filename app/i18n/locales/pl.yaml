onboarding:
  steps:
    - Witaj w OpenCiVera
    - Jak chcesz zacząć?
    - Dane osobowe
    - Podsumowanie zawodowe
    - Doświadczenie
    - Wykształcenie
    - Umiejętności
    - Języki
    - Kursy
    - Zainteresowania
    - Technologie
    - Klauzula RODO
    - Sprawdź swoje pierwsze CV
    - Czy chcesz zapisać swoje CV?
  text:
    "Could not save or finish this step. Check your connection and try again; your entries remain on this screen.": Nie udało się zapisać ani zakończyć tego kroku. Sprawdź połączenie i spróbuj ponownie. Wpisane dane pozostaną na tym ekranie.
    "Enter your name to continue.": Wpisz imię lub nazwisko, aby przejść dalej.
    "Select and copy the link above.": Zaznacz i skopiuj powyższy link.
    "Guide progress": Postęp przewodnika
    "Complete": Gotowe
    "Your first CV": Twoje pierwsze CV
    "Your CV is ready to send": Twoje CV jest gotowe do wysłania
    "Your test draft is saved": Szkic testowy został zapisany
    "Your Master CV is saved": Główne CV zostało zapisane
    "Onboarding test: this is a separate draft. Your Master CV and profile stay unchanged. Publishing creates a CV named Test onboardingu.": Test onboardingu odbywa się na osobnym szkicu. Główne CV i profil pozostają bez zmian. Publikacja utworzy CV o nazwie „Test onboardingu”.
    "Could not load your CV. Reload this page before continuing.": Nie udało się wczytać CV. Odśwież stronę przed przejściem dalej.
    "Loading your CV…": Wczytywanie CV…
    "Tell your story, one section at a time. We’ll help you build your Master CV and turn it into a CV you can share with a link.": Opisz swoje doświadczenie, uzupełniając kolejne sekcje. Pomożemy Ci przygotować główne CV i utworzyć wersję, którą udostępnisz za pomocą linku.
    "CV language": Język CV
    "Start from scratch": Zaczynam od zera
    "Fill in each section with short prompts.": Uzupełnij kolejne sekcje z pomocą krótkich wskazówek.
    "Import my CV": Importuję moje CV
    "Upload your file, check the imported details and fill in anything missing.": Wgraj plik, sprawdź odczytane dane i uzupełnij brakujące informacje.
    "Import applied. Continue to check each section.": Dane zostały zaimportowane. Przejdź dalej i sprawdź każdą sekcję.
    "Optional. Add what is relevant, or continue to skip this section.": Ta sekcja jest opcjonalna. Dodaj potrzebne informacje albo przejdź dalej.
    "Add the details you want in your CV. You can edit them later.": Dodaj informacje, które chcesz umieścić w CV. Możesz je później zmienić.
    "This preview uses your selected professional summary and completed entries. Check the information before sharing.": Podgląd zawiera wybrane podsumowanie zawodowe i uzupełnione wpisy. Sprawdź dane przed udostępnieniem.
    "Create your first saved CV and a link you can send immediately? It will appear in your dashboard.": Czy utworzyć pierwszą zapisaną wersję CV z linkiem do udostępnienia? Znajdziesz ją w panelu.
    "Anyone with the link can view this CV. Search engine indexing will be disabled. Your Master CV stays private.": Każda osoba posiadająca link będzie mogła zobaczyć to CV. Indeksowanie w wyszukiwarkach pozostanie wyłączone, a główne CV będzie prywatne.
    "Add your name and a professional summary before creating a link. You can also save and finish without publishing.": Przed utworzeniem linku uzupełnij imię lub nazwisko oraz podsumowanie zawodowe. Możesz też zakończyć bez publikowania CV.
    "Your first CV is saved in your dashboard. Copy the link to send it.": Pierwsze CV zostało zapisane w panelu. Skopiuj link, aby je udostępnić.
    "The test is complete. No public CV was created. You can start another test in account settings.": Test został zakończony. Nie utworzono publicznego CV. Kolejny test możesz uruchomić w ustawieniach konta.
    "You can create a CV with a link from your dashboard whenever you are ready.": Gdy zechcesz, możesz utworzyć CV z linkiem w panelu.

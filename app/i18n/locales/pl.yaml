landing:
  hero:
    eyebrow: // platforma publikacji LiveCV
    title_before: Stwórz LiveCV,
    title_connector: które
    title_after: razem z Tobą.
    rotating_words:
      - rośnie
      - zmienia się
      - dopasowuje się
      - nadąża
    lead:
      - Zarządzanie CV szybko staje się chaotyczne. Jedna wersja do tej rekrutacji, druga do innej roli, do tego tłumaczenia — i po kilku miesiącach trudno ustalić, który plik jest aktualny.
      - OpenCiVera porządkuje ten proces. Prowadzisz jedno źródło informacji o swoim doświadczeniu, a z niego publikujesz wersje dopasowane do różnych odbiorców.
    primary_action: Utwórz LiveCV
    secondary_action: Zobacz przykładowe LiveCV
    benefits:
      - Jedno główne CV
      - Wiele konfiguracji
      - LiveCV zawsze aktualne
  sample:
    eyebrow: // publiczny link w praktyce
    title: Twoje CV jako publiczna wizytówka.
    description: Publiczne CV przedstawia doświadczenie w przejrzysty i uporządkowany sposób. Tak wygląda strona, którą zobaczy osoba otwierająca Twój link.
    loading_aria: Ładowanie przykładowego CV
    open_aria: Otwórz przykładowe CV
    iframe_title: Przykładowe publiczne CV — OpenCiVera
    timeout: Osadzony podgląd ładuje się dłużej niż zwykle. Nadal możesz poznać platformę, otwierając pełny przykład.
    timeout_action: Otwórz przykładowe CV ↗
  model:
    eyebrow: // jedno źródło danych
    title: Skup się na swojej historii zawodowej.
    description: Zapisuj informacje o swojej karierze w jednym miejscu. Nie musisz za każdym razem układać dokumentu od nowa — wybierasz treści, a OpenCiVera przygotowuje spójną wersję CV.
    cards:
      - tag: główne CV
        chip: 1 rekord
        chip_type: t
        title: Jedno źródło informacji zawodowych
        copy: Aktualizuj doświadczenie w jednym miejscu zamiast poprawiać wiele osobnych plików przy każdej rekrutacji.
      - tag: ścieżka publikacji
        chip: Wiele widoków
        chip_type: a
        title: Dopasuj CV do odbiorcy
        copy: Wybieraj inne podsumowanie, doświadczenia i umiejętności dla różnych ról bez powielania danych źródłowych.
      - tag: wersje językowe
        chip: Wiele języków
        chip_type: t
        title: Publikuj we właściwym języku
        copy: Dodawaj kolejne wersje językowe i publikuj je pod jednym, spójnym adresem.
  cta:
    eyebrow: // zacznij teraz
    title: Zbuduj swoje LiveCV z OpenCiVera.
    description: Zobacz przykładowe LiveCV, a następnie utwórz własne na podstawie jednego, aktualnego źródła danych.
    primary_action: Utwórz LiveCV
    secondary_action: Zobacz przykładowe LiveCV ↗
  footer:
    sample_resume: Przykładowe CV
    platform: Platforma
    privacy_policy: Polityka prywatności
    terms: Warunki korzystania
    contact: Kontakt

    faq: FAQ
    formats_label: Export formats
    start_label: Start
    stages:
      - id: livecv
        label: LiveCV?
        title: A LiveCV is your CV as a page at a link.
        body: Send an address instead of a file. A recruiter opens your CV in the browser, and you publish a new version whenever you choose, without sending more files. A PDF is there when you need one.
      - id: base
        label: Experience Base
        title: First, you gather everything in your Experience Base.
        body: Record roles, courses, skills and achievements once, in one private place. You can start by importing your current CV.
      - id: pick
        label: Selection
        title: You pick what fits the role.
        body: From the base, you choose content for a separate LiveCV tailored to a specific job offer. Your full history stays in the base.
      - id: ready
        label: Your LiveCV
        title: Your selected entries become a LiveCV.
        body: You publish it at its own link and send the address instead of another file.
      - id: versions
        label: Versions
        title: The same base gives you more versions.
        body: Each version has its own link, content selection and language, so you can fit it to a specific offer.
      - id: history
        label: History
        title: Your LiveCV's publication history.
        body: Every publication saves the published state of your LiveCV, so you can go back to it. Editing the base does not change a published LiveCV until you publish it again.
      - id: feats
        label: Features
        title: OpenCiVera features
        body: No paywalls, open data import and export in several formats, GDPR compliance and full control over what you share.
      - id: go
        label: Get started
        title: Your LiveCV as a public profile.
        body: A published LiveCV is available at a public link. Recruiters and colleagues open it in the browser, and you decide which information to share.

landing:
  hero:
    title:
      - Create your
      - ideal LiveCV,
    title_prefix: one that
    title_suffix: with you.
    rotating_words:
      - grows
      - evolves
      - adapts
      - develops
    description:
      - Traditional CVs become outdated as soon as you publish them. Even a small change means generating another file. What if your experience lets you apply for three distinct career paths? You end up maintaining three editable versions and documents tailored to specific opportunities.
      - OpenCiVera lets you build one structured source of career data and select content for separate LiveCVs. Publish each under its own link, and when you add new experience, publish it again. If you need a PDF version, you can download one whenever you need it.
      - The platform is free, and your data stays private. You publish only what you choose to share.
    primary_action: Create LiveCV
    secondary_action: View sample LiveCV
    lead: OpenCiVera lets you build one structured source of career data and select content from it for separate LiveCVs. You publish each under its own link, and when you add new experience, you publish it again.
    free_note: "Completely free: no paywalls, no hidden fees."
  story:
    aria_label: How OpenCiVera works
    rail_label: Stages
    short_screen:
      title: This story needs more room.
      text: This page is designed for windows taller than 560px. Make the window taller to open the full animation.
      action: Show the simplified version
    next: Scroll

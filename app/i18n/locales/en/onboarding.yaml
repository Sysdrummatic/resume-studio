    "Copied": Copied
    "Copy link": Copy LiveCV link
    "Open CV": Open LiveCV
    "Go to dashboard": Go to dashboard
    "Testing settings": Testing settings
    "Your entries are saved to your account when you change steps or finish later.": Your entries are saved to your account when you change steps or finish later.
    "Finish later": Finish later
    "Back": Back

legal:
  privacy:
    title: Privacy Policy
    description: How OpenCiVera collects, uses, and protects your account and LiveCV data.
    last_updated: "Last updated: 2026-07-24"
    sections:
      - icon: undefined
        title: 1. Who We Are
        paragraphs:
          - |
            OpenCiVera ("we", "us", "our") is operated by Łukasz Michta. For any questions about this policy or your personal data, contact us at privacy@opencivera.com.
      - icon: undefined
        title: 2. What Data We Collect
        paragraphs: []
        bullets:
          - |
            Account data: email address, encrypted password (managed by our authentication provider), display name, profile photo (optional), account role.
          - |
            LiveCV content: any information you choose to add to your LiveCV documents, which may include your name, job title, professional summary, contact details (email, phone, location, LinkedIn, website), skills, technologies, languages, work experience, education, and courses or certifications.
          - |
            Published LiveCV data: snapshots of LiveCV versions you choose to publish, and metadata about the public links you create (status, selected languages, visibility settings).
          - |
            Usage data: aggregated view counts for your published LiveCV links, and administrative audit logs used for security purposes (account actions with timestamps).
          - |
            Security scanning: saved LiveCV content is automatically scanned for signs of malicious script injection; if flagged, a hash of the matching fragment (not the raw content) plus a rule identifier is logged for staff review.
      - icon: undefined
        title: 3. Why We Process Your Data
        paragraphs: []
        bullets:
          - |
            To create and operate your account and provide the LiveCV-management and publishing service. Legal basis: performance of a contract (GDPR Art. 6(1)(b)).
          - |
            To generate and host public LiveCV links at your request. Legal basis: performance of a contract.
          - |
            To maintain security, prevent abuse, and keep administrative audit logs. Legal basis: legitimate interest (GDPR Art. 6(1)(f)).
          - We do not use your data for advertising and we do not sell your data.
      - icon: undefined
        title: 4. Who We Share Your Data With
        paragraphs:
          - |
            We use the following service providers (processors) to operate OpenCiVera:
        bullets:
          - |
            Supabase, for our database, authentication, and file storage, hosted in the European Union (Frankfurt).
          - |
            Netlify, Inc., for application hosting. Netlify is based in the United States; Netlify's standard Data Processing Agreement and Standard Contractual Clauses apply to any transfer of personal data outside the European Economic Area.
          - |
            Resend, for transactional emails (such as account-deletion confirmation and authentication emails). Resend is based in the United States; Resend's standard Data Processing Agreement and Standard Contractual Clauses apply to any transfer of personal data outside the European Economic Area.
        after:
          - We do not share your LiveCV content with any other third party unless you choose to make it publicly available via a Public Link that you create.
          - |
            OpenCiVera is currently an MVP (Minimum Viable Product) in a testing phase. We are not responsible for changes that Supabase or Netlify make to their own privacy policies, terms, or data-handling practices; please refer to their respective policies for the most current information.
      - icon: undefined
        title: 5. Data Retention
        paragraphs: []
        bullets:
          - While your account is active, we retain your account and LiveCV data for as long as you keep your account.
          - |
            If you delete your account yourself using the "Delete account and all data" option in your account settings, your personal data is deleted immediately.
          - |
            If you request deletion through other means (for example, because you can no longer access your account), we will delete your personal data within 30 days of confirming the request, except where retention is required by law or for legitimate security purposes (such as administrative audit logs).
          - |
            Aggregated, non-identifying analytics (such as link view counts) may be retained longer for product improvement, in line with our internal data retention policy.
      - icon: undefined
        title: 6. Your Rights
        paragraphs:
          - "Under the GDPR, you have the right to:"
        bullets:
          - Access the personal data we hold about you.
          - Request correction of inaccurate data.
          - Request erasure of your data ("right to be forgotten").
          - Request restriction of processing.
          - Receive a copy of your data in a portable format.
          - Object to processing based on legitimate interest.
          - Lodge a complaint with your local data protection authority. In Poland, this is the President of the Personal Data Protection Office (UODO).
        after:
          - To exercise any of these rights, contact us at privacy@opencivera.com. We will respond within one month, as required by law.
      - icon: undefined
        title: 7. Cookies
        paragraphs:
          - We use only cookies that are strictly necessary for authentication, to keep you signed in. We do not use third-party advertising or analytics cookies that require consent.
      - icon: undefined
        title: 8. International Data Transfers
        paragraphs:
          - Your account and LiveCV data are stored within the European Economic Area (EU, Frankfurt). Where a service provider is located outside the EEA, appropriate safeguards (such as Standard Contractual Clauses) are in place.
      - icon: undefined
        title: 9. Children
        paragraphs:
          - OpenCiVera is not directed at individuals under the age of 16, and we do not knowingly collect personal data from children.
      - icon: undefined
        title: 10. Changes to This Policy
        paragraphs:
          - We may update this policy from time to time. The "Last updated" date at the top reflects the most recent revision. Material changes will be communicated via email or an in-app notice.
      - icon: undefined
        title: 11. Contact
        paragraphs:
          - "For privacy-related questions or requests, contact: privacy@opencivera.com"
  terms:
    title: Terms of Service
    description: The terms that govern your use of OpenCiVera.
    last_updated: "Last updated: 2026-07-24"
    sections:
      - icon: undefined
        title: 1. About These Terms
        paragraphs:
          - |
            These Terms of Service ("Terms") govern your access to and use of OpenCiVera (the "Service"), operated by Łukasz Michta ("we", "us", "our"). By creating an account or using the Service, you agree to these Terms. If you do not agree, do not use the Service.
      - icon: undefined
        title: 2. The Service
        paragraphs:
          - |
            OpenCiVera lets you create, manage, and optionally publish CV/resume content, called LiveCV, at a stable link that you control. Features may be experimental, in development, or may change over time. We provide the Service on a best-effort basis and do not guarantee uptime, availability, or that any particular feature will remain available.
      - icon: undefined
        title: 3. Eligibility and Accounts
        paragraphs:
          - You must be at least 16 years old to create an account. You are responsible for maintaining the confidentiality of your account credentials and for all activity under your account. You must provide accurate information when creating your account.
      - icon: undefined
        title: 4. Your Content
        paragraphs:
          - |
            You retain ownership of the content you create or upload to your LiveCV documents ("Your Content"). By using the Service, you grant us a limited license to host, store, process, and display Your Content as necessary to provide the Service to you.
          - |
            If you choose to publish Your Content via a Public Link, you grant us a license to make that content publicly accessible at the link you create, for as long as the link remains published. You are solely responsible for deciding what to publish, including ensuring you have the right to include any third-party information (such as references' contact details) in published content.
          - You may unpublish or delete Your Content at any time through the features provided in the Service.
      - icon: undefined
        title: 5. Acceptable Use
        paragraphs:
          - |
            You agree not to use the Service to:
        bullets:
          - Upload or publish unlawful, defamatory, or infringing content.
          - Impersonate any person or entity, or misrepresent your affiliation.
          - Attempt to gain unauthorized access to other accounts or to the Service's infrastructure.
          - Use the Service to distribute spam or malware, or to scrape or harvest data from other users' public LiveCV pages at scale.
        after:
          - We may suspend or terminate accounts that violate these Terms.
      - icon: undefined
        title: 6. The OpenCiVera Brand, and the OpenCV Format
        paragraphs:
          - |
            "OpenCiVera" and associated logos are our trademarks and may not be used without permission, except as necessary to refer to the Service (for example, linking to your published LiveCV). These Terms govern your use of the OpenCiVera Service only; they do not restrict use of the OpenCV data format specification itself, which is documented and published separately.
      - icon: undefined
        title: 7. Free Use and Future Changes
        paragraphs:
          - The Service is currently provided free of charge. We may introduce paid plans or features in the future. If we do, we will provide reasonable advance notice before any change affects your existing account, and continued use of any new paid feature will be optional unless clearly stated otherwise.
      - icon: undefined
        title: 8. Termination
        paragraphs:
          - You may stop using the Service and request deletion of your account at any time, as described in our Privacy Policy. We may suspend or terminate your access if you violate these Terms, or discontinue the Service (or features of it) with reasonable notice where practicable.
      - icon: undefined
        title: 9. Disclaimers
        paragraphs:
          - |
            The Service is provided "as is" and "as available", without warranties of any kind, express or implied, including warranties of merchantability, fitness for a particular purpose, or non-infringement. We do not warrant that the Service will be uninterrupted, secure, or error-free.
      - icon: undefined
        title: 10. Limitation of Liability
        paragraphs:
          - |
            To the maximum extent permitted by applicable law, Łukasz Michta shall not be liable for any indirect, incidental, special, consequential, or punitive damages, or any loss of data, revenue, or profits, arising from your use of, or inability to use, the Service. Nothing in these Terms excludes or limits liability that cannot be excluded or limited under applicable law.
      - icon: undefined
        title: 11. Governing Law
        paragraphs:
          - These Terms are governed by the laws of Poland. This section does not affect any mandatory consumer-protection rights you may have under the laws of your country of residence.
      - icon: undefined
        title: 12. Changes to These Terms
        paragraphs:
          - We may update these Terms from time to time. The "Last updated" date above reflects the most recent revision. Material changes will be communicated via email or an in-app notice, consistent with how we communicate changes to our Privacy Policy.
      - icon: undefined
        title: 13. Contact
        paragraphs:
          - "Questions about these Terms can be sent to support@opencivera.com."

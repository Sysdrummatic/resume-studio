summary: |
  Jeg er en resultatorientert salgssjef med bakgrunn fra produksjon og industri, noe som gir meg en sjelden evne
  til å snakke både kundenes og produksjonsgulvets språk. De siste ti årene har jeg bygget og ledet salgsteam

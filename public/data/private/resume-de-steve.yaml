    default: false
  - position: "Vertriebsspezialist"
    description: "Vertriebsexperte mit Erfahrung im beratenden B2B-Vertrieb, in der Bedarfsermittlung, Angebotserstellung und Kundenentwicklung. Steeve verbindet eine Marketingausbildung mit technischer Neugier und kann dadurch Kundenbedürfnisse wirksam in Lösungssprache übersetzen sowie lange Vertriebszyklen für Software- und Technologiedienstleistungen unterstützen."

role_inheritance_model:
  agent: software_architect
  role: Architect
  task: "analyze_role_inheritance_model"
  status: ready_for_pm_handoff
  requested_contract:
    base_role: "user"
    inherited_roles:
      manager:
        inherits: ["user"]
      recruiter:
        inherits: ["user"]
      admin:
        inherits: ["manager", "recruiter"]
  current_state:
    storage:
      profiles_role: "Flat text enum: admin, manager, user, recruiter."
      recommendation: "Keep flat persisted role values; model inheritance in capability helpers and SQL predicates."
    typescript:
      role_type_file: "app/lib/auth-types.ts"
      rbac_file: "app/lib/rbac.ts"
      current_issue: "Route guards use acceptedRoles arrays with direct includes, so inheritance is expressed manually and inconsistently."
    api:
      admin:
        files:
          - "app/api/admin/users/route.ts"
          - "app/api/admin/users/[userId]/route.ts"
        current_guard: "requireRequestActor([\"admin\", \"manager\"])"
        target_guard: "requireCapability(\"admin.users.read\") and mutation-specific capabilities."
      resume:
        files:
          - "app/api/resume/document/route.ts"
          - "app/api/resume/draft/route.ts"
          - "app/api/resume/publish/route.ts"
          - "app/api/resume/rollback/route.ts"
          - "app/api/resume/presets/**"
          - "app/api/resume/languages/route.ts"
        current_guard: "Most owner resume routes accept all roles; language GET/PATCH/DELETE exclude recruiter while POST includes recruiter."
        target_guard: "Use explicit owner resume capabilities; decide whether recruiter should have language management parity through inheritance."
    ui:
      files:
        - "app/components/account-menu.tsx"
        - "app/admin/page.tsx"
        - "app/admin/admin-users-client.tsx"
      current_issue:
        - "Account menu shows User management only for admin, while /admin allows manager."
        - "Admin page/client duplicate role checks instead of using shared permissions."
    database:
      files:
        - "supabase/migrations/20260410_phase_b_yaml_data_layer.sql"
        - "supabase/migrations/20260410_phase_c_auth_rbac_admin.sql"
        - "supabase/migrations/20260509_privacy_first_admin_access.sql"
      current_issue:
        - "SQL helpers are flat-role predicates: is_admin_user, is_manager_user, is_staff_user."
        - "Privacy hardening keeps resume content owner-only; inheritance must not reintroduce staff content access."
  capability_matrix:
    user:
      inherits: []
      capabilities:
        - "auth.session.read"
        - "dashboard.read_own"
        - "profile.read_own"
        - "resume.document.read_own"
        - "resume.document.write_own"
        - "resume.revision.rollback_own"
        - "resume.preset.read_own"
        - "resume.preset.write_own"
        - "resume.preset.publish_own"
        - "resume.preset.unpublish_own"
        - "resume.language.read_enabled"
        - "resume.language.create_own_document"
        - "resume.language.set_default_own"
        - "resume.language.disable_global"
      denied:
        - "admin.users.read"
        - "admin.users.role_write"
        - "admin.users.status_write"
        - "admin.users.delete"
        - "admin.audit.read"
        - "admin.analytics.read"
        - "resume.content.read_other"
    recruiter:
      inherits: ["user"]
      capabilities:
        - "recruiter.workflow.own"
      denied:
        - "admin.users.read"
        - "admin.users.role_write"
        - "admin.users.status_write"
        - "admin.users.delete"
        - "admin.audit.read"
        - "admin.analytics.read"
        - "resume.content.read_other"
      note: "Current product/docs say recruiter has user parity for MVP; no ambient staff/admin visibility."
    manager:
      inherits: ["user"]
      capabilities:
        - "admin.area.access"
        - "admin.users.read_manageable"
        - "admin.users.role_write_manageable_user_recruiter"
        - "admin.users.status_write_manageable_user_recruiter"
        - "admin.users.delete_manageable_user_recruiter"
        - "admin.audit.read_metadata"
        - "admin.analytics.read_metadata"
      denied:
        - "admin.users.manage_manager"
        - "admin.users.manage_admin"
        - "admin.users.self_privilege_write"
        - "resume.content.read_other"
      note: "Manager is operational staff, not a resume-content override."
    admin:
      inherits: ["manager", "recruiter"]
      capabilities:
        - "admin.area.access"
        - "admin.users.read_all"
        - "admin.users.role_write_all"
        - "admin.users.status_write_all"
        - "admin.users.delete_all"
        - "admin.audit.read_metadata"
        - "admin.analytics.read_metadata"
        - "recruiter.workflow.own"
      denied:
        - "resume.content.read_other"
      note: "Admin inherits manager/recruiter capabilities but privacy ADR still blocks ambient private CV content."
  implementation_approach:
    typescript:
      - "Add AppCapability union and ROLE_INHERITS/ROLE_CAPABILITIES constants in app/lib/rbac.ts or adjacent app/lib/capabilities.ts."
      - "Add getEffectiveRoles(role), hasRole(actorRole, requiredRole), hasCapability(actorRole, capability), requireCapabilityResult(actor, capability)."
      - "Change requireRequestActor to accept either legacy acceptedRoles or new { anyCapability: [...] } option; preserve acceptedRoles during migration."
      - "Replace raw role array checks route-by-route only after tests exist."
      - "Keep canAssignRole/canDeleteTarget as target-aware policy helpers; implement them on top of capabilities and target role classes."
    api_guards:
      - "Admin list: require admin.users.read; filter manager results to self + user/recruiter."
      - "Admin role/status/delete: require mutation capability and target-aware helper."
      - "Owner resume routes: require resume.*_own capabilities plus owner userId from actor; do not allow staff target overrides."
      - "Language routes: align recruiter with user if inheritance is accepted, or document deliberate exception as product policy."
      - "Public export routes stay anonymous and snapshot-only; no staff/recruiter capability applies."
    ui_gates:
      - "Expose /admin link via canAccessAdminArea/hasCapability so manager sees the same access the server allows."
      - "Use shared canManageTargetUser/canAssignTargetRole helper in admin client for disabled controls and role option lists."
      - "Never rely on UI gates as enforcement; server and SQL remain authoritative."
    database:
      - "Add a compatibility migration that creates has_role(required_role text) and has_capability(required_capability text), or updates is_staff_user/current helper docs."
      - "Do not change profiles.role storage or enum values."
      - "Do not broaden owner-only resume RLS from ADR 0003."
      - "If SQL capabilities are added, keep helper allowlist explicit and tested; avoid dynamic table-driven permissions for MVP."
  migration_strategy:
    phase_0_design:
      - "Document capability matrix and acceptance criteria."
      - "Inventory every direct role comparison in app/api, app pages, app components, tests, and migrations."
    phase_1_compat_helpers:
      - "Add TS capability helpers without changing behavior."
      - "Add unit/contract tests proving admin expands to manager+recruiter+user, manager expands to user only, recruiter expands to user only."
    phase_2_guard_migration:
      - "Migrate API guards from acceptedRoles arrays to capabilities one endpoint group at a time."
      - "Keep acceptedRoles overload until all routes and tests are migrated."
    phase_3_sql_alignment:
      - "Add forward-only migration for SQL helper predicates if API/RLS/RPC need them."
      - "Preserve profiles.role data; no backfill required unless invalid legacy values are found."
    phase_4_docs_cleanup:
      - "Update phase C, privacy-first admin, SaaS transition, deployment QA, and tests to describe inherited roles."
  risks:
    high:
      - id: "R1"
        note: "Admin inheriting recruiter can conflict with ADR 0003 wording that recruiter is separate from staff/admin roles."
        mitigation: "Define inheritance as capability composition only; recruiter.workflow.own is inherited, but recruiter content-access scopes remain future consent-based and excluded."
      - id: "R2"
        note: "Capability expansion could accidentally grant manager/admin private resume content access."
        mitigation: "Resume content capabilities are owner-only and RLS remains owner-only."
      - id: "R3"
        note: "SQL and TS authorization drift can create bypasses through RPC or direct Supabase calls."
        mitigation: "Keep SQL target-aware functions aligned with TS helpers and add contract tests scanning both."
    medium:
      - id: "R4"
        note: "Existing language routes treat recruiter inconsistently: POST allowed, GET/PATCH/DELETE denied."
        mitigation: "PM/product must decide if recruiter gets full user language management parity; recommended yes for base-user inheritance."
      - id: "R5"
        note: "UI currently hides /admin from manager despite server access."
        mitigation: "Frontend gate should use admin.area.access capability."
      - id: "R6"
        note: "Tests assert literal acceptedRoles arrays and will need staged updates."
        mitigation: "Add capability tests first, then update brittle source-string assertions."
  pm_handoff_tasks:
    - owner: project_manager
      cmd: "sequence_role_inheritance_rollout"
      scope:
        - ".codex/state.yaml#role_inheritance_model"
        - "docs/action-plan.md"
      deliverable: "Small PR sequence with owners and rollback gates."
    - owner: backend_engineer
      cmd: "impl_capability_helpers_and_api_guards"
      scope:
        - "app/lib/rbac.ts"
        - "app/lib/auth-request.ts"
        - "app/lib/auth-server.ts"
        - "app/api/admin/**"
        - "app/api/resume/**"
      deliverable: "Capability-based authorization helpers and migrated guards with backward-compatible acceptedRoles support."
    - owner: backend_engineer
      cmd: "impl_sql_capability_alignment"
      scope:
        - "supabase/migrations/**"
        - "docs/guides/phase-c-auth-rbac-admin.md"
        - "docs/guides/privacy-first-admin-access-policy.md"
      deliverable: "Forward-only migration or explicit decision that current SQL target helpers are sufficient."
    - owner: frontend_engineer
      cmd: "impl_role_capability_ui_gates"
      scope:
        - "app/components/account-menu.tsx"
        - "app/admin/page.tsx"
        - "app/admin/admin-users-client.tsx"
      deliverable: "UI gates and disabled states use shared capability/target policy."
    - owner: test_engineer
      cmd: "add_role_inheritance_regression"
      scope:
        - "tests/**"
      deliverable: "Unit/contract tests for capability expansion, API guard literals removed or updated, SQL helper/RLS privacy assertions preserved."
  acceptance_criteria:
    - "profiles.role remains one of admin, manager, user, recruiter; no existing profile rows require migration."
    - "hasRole(admin, manager), hasRole(admin, recruiter), hasRole(admin, user), hasRole(manager, user), and hasRole(recruiter, user) are true."
    - "manager does not inherit recruiter; recruiter does not inherit manager."
    - "Admin and manager can access /admin; recruiter and user cannot."
    - "Manager can manage only user/recruiter target accounts and cannot modify own privileges."
    - "Admin can manage all profile roles/status/deletes."
    - "All roles can manage only their own resume content unless a future explicit consent model is approved."
    - "Recruiter parity with user is either implemented across owner resume/language endpoints or explicitly documented as an exception."
    - "Public routes and OpenCV export remain snapshot-only and unauthenticated."
  test_strategy:
    targeted:
      - "Add app/lib/rbac tests for inheritance expansion, capability checks, target-aware role assignment, and delete decisions."
      - "Add/adjust API contract tests for admin users routes to use capability helpers while still excluding recruiter from admin access."
      - "Add resume/language guard tests confirming user-equivalent owner behavior for recruiter if parity is adopted."
      - "Add migration/source contract tests ensuring owner-only resume RLS remains in 20260509_privacy_first_admin_access.sql."
      - "Add UI source/behavior test confirming account menu exposes User management to admin and manager only."
    default_validation:
      - "npm.cmd run lint"
      - "npm.cmd run typecheck"
      - "npm.cmd test"
  next_trigger:
    REQ: project_manager
    CMD: "sequence_role_inheritance_rollout"
    CTX:
      ref: ".codex/state.yaml#role_inheritance_model"
      scope:
        - "app/lib/rbac.ts"
        - "app/lib/auth-request.ts"
        - "app/api/**"
        - "app/components/account-menu.tsx"
        - "app/admin/**"
        - "docs/**"
        - "supabase/**"
        - "tests/**"
    LMT:
      - "security-first"
      - "least-privilege"
      - "backward-compatible-migration"

public_link_management_rollout_package:
  agent: project_manager
  role: PM
  task: "Expose public-link management from the editor or an adjacent panel"
  status: ready_for_frontend_t1
  prepared_at: "2026-05-12"
  source_refs:
    - "docs/action-plan.md"
    - "docs/guides/deployment-qa.md"
    - "docs/guides/saas-transition-work-plan.md"
    - ".codex/site-map-and-dependencies.md"
    - "docs/adr/0001-cv-publication-model.md"
  objective: "Give authenticated users a clear, owner-scoped surface near the editor for viewing and managing Public Link lifecycle state for CV Versions without changing snapshot publication semantics."
  non_goals:
    - "No public route redesign."
    - "No schema migration unless architect finds a blocking missing field."
    - "No broad user panel or analytics implementation in this slice."
    - "No public URL for private/unpublished CV Versions."
    - "No mutation of historical Published CV snapshots."
  current_contract:
    frontend:
      - "Dashboard already lists CV Versions and can publish/unpublish through app/api/resume/presets/[presetId]/publish and /unpublish."
      - "Dashboard receives canonical_public_path and compatibility_public_path on ResumePresetRow."
      - "Master Resume Editor owns draft YAML/revisions/language management but does not currently expose Saved Version/Public Link lifecycle."
    backend:
      - "Publish route requires selectedLocales and optional defaultLocale/allowIndexing/aiGenerated."
      - "Unpublish route revokes through unpublishResumePreset."
      - "resume-server maps active resume_public_links to canonical_public_path and compatibility_public_path."
      - "Public rendering resolves snapshot-backed resume_published_cvs/locales and keeps /r/[slug] compatibility."
    tests:
      - "tests/dashboard-presets.test.mjs covers canonical/compatibility path presence."
      - "tests/cv-publication-runtime-contract.test.mjs covers transactional publish/unpublish and snapshot preference."
      - "tests/cv-public-publicid-route.test.mjs and tests/cv-public-compatibility-route.test.mjs cover public routing behavior."
  execution_backlog:
    - id: "PLM-1"
      title: "Architect boundary review for editor-adjacent Public Link management"
      owner: software_architect
      estimate: "S"
      ready: true
      scope:
        - "app/dashboard/dashboard-client.tsx"
        - "app/master-resume/editor-canvas-client.tsx"
        - "app/api/resume/presets/[presetId]/publish/route.ts"
        - "app/api/resume/presets/[presetId]/unpublish/route.ts"
        - "app/lib/resume-server.ts"
      dor:
        - "PM rollout package exists in state.yaml."
        - "Existing publication model and route contracts are identified."
      dod:
        - "Confirm whether frontend can reuse existing preset list/publish/unpublish contracts."
        - "Confirm whether a read-only editor-adjacent list can be server-fed or client-fetched without new data access."
        - "Confirm no schema or public route changes are needed for first increment."
        - "Record any required backend contract changes before frontend implementation starts."
      rollback: "Docs/state-only; revert package if superseded by architecture decision."
    - id: "PLM-2"
      title: "Backend contract hardening only if needed"
      owner: backend_engineer
      estimate: "S-M"
      ready: false
      blocked_by:
        - "PLM-1"
      scope:
        - "app/api/resume/presets/route.ts"
        - "app/api/resume/presets/[presetId]/publish/route.ts"
        - "app/api/resume/presets/[presetId]/unpublish/route.ts"
        - "app/lib/resume-server.ts"
        - "tests/cv-publication-runtime-contract.test.mjs"
        - "tests/dashboard-presets.test.mjs"
      dor:
        - "Architect identifies a missing response field, status ambiguity, or auth boundary not solvable in frontend."
      dod:
        - "Responses remain actor-userId scoped."
        - "Published rows expose canonical_public_path, compatibility_public_path, allow_indexing, is_public, default_locale, and published locale metadata needed by UI."
        - "Unpublish failures fail closed and do not leave UI believing the link is revoked."
        - "No private draft YAML/content is added to link-management responses."
        - "Focused backend/contract tests pass."
      rollback: "Revert backend/test commit; existing dashboard publish/unpublish flow remains fallback."
    - id: "PLM-3"
      title: "Build editor-adjacent Public Link panel"
      owner: frontend_engineer
      estimate: "M"
      ready: false
      blocked_by:
        - "PLM-1"
        - "PLM-2 if required"
      scope:
        - "app/master-resume/editor-canvas-client.tsx"
        - "app/dashboard/dashboard-client.tsx if shared helper extraction is approved"
        - "app/components/** if a reusable link panel component is introduced"
        - "app/globals.css"
        - "tests/dashboard-presets.test.mjs"
      dor:
        - "Backend contract is confirmed stable."
        - "UI location is editor-adjacent: inside /master-resume side panel or a nearby authenticated route linked from editor."
      dod:
        - "User can see own CV Version link states from the editor-adjacent surface."
        - "Published CV Versions show canonical URL first and compatibility URL as secondary."
        - "Private CV Versions show no copyable public URL."
        - "Copy canonical link action has visible success/error feedback."
        - "Open link action targets canonical URL."
        - "Publish/unpublish actions reuse existing API semantics or route users to the existing publish modal; no duplicate publication rules."
        - "Loading, empty, and error states are deterministic and accessible."
      rollback: "Revert frontend commit; dashboard remains the public-link management fallback."
    - id: "PLM-4"
      title: "Dashboard parity and navigation polish"
      owner: frontend_engineer
      estimate: "S"
      ready: false
      blocked_by:
        - "PLM-3"
      scope:
        - "app/dashboard/dashboard-client.tsx"
        - "app/master-resume/editor-canvas-client.tsx"
        - "app/globals.css"
        - "tests/dashboard-presets.test.mjs"
      dor:
        - "Editor-adjacent panel is implemented."
      dod:
        - "Dashboard and editor-adjacent panel use consistent terminology: CV Version, Published, Private, Indexable/Noindex, Canonical, Compatibility."
        - "Navigation between editor and CV Version management is clear without introducing a marketing/landing screen."
        - "No UI presents /r/[slug] as canonical."
      rollback: "Revert UI polish commit only."
    - id: "PLM-5"
      title: "Regression coverage and QA execution"
      owner: test_engineer
      estimate: "M"
      ready: false
      blocked_by:
        - "PLM-2 if required"
        - "PLM-3"
        - "PLM-4"
      scope:
        - "tests/dashboard-presets.test.mjs"
        - "tests/cv-publication-runtime-contract.test.mjs"
        - "tests/cv-public-publicid-route.test.mjs"
        - "tests/cv-public-compatibility-route.test.mjs"
        - "docs/guides/deployment-qa.md"
      dor:
        - "Implementation PRs are complete and locally runnable."
      dod:
        - "Tests assert canonical URL preference, private no-link state, publish/unpublish UI hooks, and copy/open affordances."
        - "Snapshot-backed public route tests remain green."
        - "Validation evidence records npm.cmd run lint, npm.cmd run typecheck, and npm.cmd test."
        - "Manual QA checklist includes publish, copy, open, unpublish, republish, draft-edit-after-publish, and revoked-link behavior."
      rollback: "Tests/docs-only rollback if assertions need to be re-scoped; production rollback follows PLM-2/PLM-3."
    - id: "PLM-6"
      title: "Release docs and status closeout"
      owner: project_manager
      estimate: "S"
      ready: false
      blocked_by:
        - "PLM-5"
      scope:
        - "docs/action-plan.md"
        - "docs/guides/deployment-qa.md"
        - "docs/guides/saas-transition-work-plan.md"
        - ".codex/state.yaml"
      dor:
        - "Automated and manual validation evidence is available."
      dod:
        - "Action plan marks public-link management complete or records residual follow-up."
        - "Deployment QA guide reflects actual implemented smoke steps."
        - "SaaS transition work plan status matches shipped behavior."
        - "state.yaml records final validation, risks, and next trigger."
      rollback: "Docs/state-only rollback."
  parallelization:
    safe_parallel:
      - owners:
          - software_architect
          - test_engineer
        when: "After PM package is available."
        scopes:
          software_architect:
            - "Architecture review only; no file edits unless recording state."
          test_engineer:
            - "Prepare QA matrix and inspect existing tests; no implementation assertions requiring unbuilt UI."
      - owners:
          - backend_engineer
          - frontend_engineer
        when: "After PLM-1 if backend change is required and exact API fields are agreed."
        scopes:
          backend_engineer:
            - "app/api/resume/presets/**"
            - "app/lib/resume-server.ts"
            - "backend/contract tests only"
          frontend_engineer:
            - "app/master-resume/**"
            - "app/dashboard/**"
            - "app/components/**"
            - "app/globals.css"
    must_be_sequential:
      - "PLM-1 before production code changes."
      - "PLM-2 before PLM-3 if API shape must change."
      - "PLM-5 after implementation, because tests must lock actual UI/API behavior."
      - "PLM-6 after validation evidence."
    disjoint_ownership_rules:
      - "Frontend does not edit app/lib/resume-server.ts or API routes except with explicit backend handoff."
      - "Backend does not edit React/CSS files."
      - "Test engineer can edit tests/docs only after implementation scope is known."
      - "Project manager owns docs/action-plan.md, state.yaml manifest/status, and rollout closeout."
  release_plan:
    strategy: "Small PR sequence with dashboard fallback preserved throughout."
    checkpoints:
      - id: "G1"
        name: "Architecture go"
        go: "No new schema, no public route semantics change, no private-content exposure."
        no_go:
          - "UI requires data not currently owner-scoped."
          - "Canonical/compatibility semantics are ambiguous."
      - id: "G2"
        name: "Backend contract go"
        go: "Existing or hardened endpoints return needed link metadata and fail closed."
        no_go:
          - "Publish/unpublish can leave active link state inconsistent."
          - "Tests show live drafts can affect public route."
      - id: "G3"
        name: "Frontend go"
        go: "Manual QA verifies private/published/revoked states, canonical copy/open, and no full reload needed for state transition."
        no_go:
          - "Private CV Version exposes copyable URL."
          - "Compatibility route is presented as canonical."
      - id: "G4"
        name: "Release candidate go"
        go: "npm.cmd run lint, npm.cmd run typecheck, npm.cmd test pass; deployment QA checklist is updated."
        no_go:
          - "Any auth, snapshot rendering, or public route regression."
    rollout_steps:
      - "Ship backend hardening first only if needed."
      - "Ship editor-adjacent panel behind existing authenticated route access; no feature flag required if dashboard fallback remains."
      - "Run preview smoke against publish/copy/open/unpublish/republish and public route snapshot behavior."
      - "Deploy after default validation and manual smoke are green."
  rollback_plan:
    strategy: "Rollback by newest small PR first; dashboard publish/unpublish remains operational fallback."
    steps:
      - "If frontend regression: revert PLM-3/PLM-4; keep backend contract if backward-compatible."
      - "If backend regression: revert PLM-2 and dependent frontend calls; dashboard fallback remains on prior contract."
      - "If public route regression: block release, revert backend changes, rerun snapshot route tests."
      - "If docs/status mismatch only: revert PLM-6 docs/state update."
    data_rollback: "None expected; publish/unpublish uses existing transactional RPC behavior. Do not mutate historical migrations or Published CV snapshots."
  acceptance_criteria:
    - "Public-link management is reachable from /master-resume or an adjacent authenticated panel without replacing the existing dashboard Saved Version workflow."
    - "The surface lists only the signed-in actor's own CV Versions and Public Links."
    - "Private/unpublished CV Versions show no public URL and cannot be copied as public links."
    - "Published CV Versions show canonical /{person-slug}/{public-id} first and legacy /r/[slug] only as compatibility information."
    - "Copy-link action copies the canonical public URL and has a non-blocking success/error state."
    - "Open-link action targets the canonical public URL for published links."
    - "Unpublish revokes the active Public Link, updates UI state without a full reload, and does not delete the Saved Version."
    - "Republish after unpublish follows existing public-id semantics and does not mutate historical Published CV snapshots."
    - "Indexing state is visible and controlled only through the existing publish flow unless a backend-reviewed update endpoint is explicitly added."
    - "Published/default language metadata is visible and remains aligned with the publish modal selected-locale contract."
    - "Draft edits in Master Resume do not change an already published public page until explicit publish."
    - "Missing, revoked, or failed Public Link lookups fail closed with clear UI state."
    - "Existing public routes continue to render snapshot-backed data only."
    - "Automated validation passes: npm.cmd run lint, npm.cmd run typecheck, npm.cmd test."
  estimates:
    total_band: "M-L"
    critical_path:
      - "PLM-1"
      - "PLM-2 only if required"
      - "PLM-3"
      - "PLM-5"
      - "PLM-6"
    by_ticket:
      PLM-1: "S"
      PLM-2: "S-M"
      PLM-3: "M"
      PLM-4: "S"
      PLM-5: "M"
      PLM-6: "S"
    note: "Critical path is frontend-heavy if backend contract is already sufficient; becomes backend-gated only if architect requires API shape changes."
  risks:
    - id: "PLM-R1"
      severity: "high"
      note: "UI could expose or copy a revoked/private link."
      mitigation: "Render copy/open actions only when is_public and canonical_public_path are present; test private/revoked state."
    - id: "PLM-R2"
      severity: "high"
      note: "Draft edits could be implied as public changes."
      mitigation: "Copy and state text must distinguish Master Resume drafts from Published CV snapshots."
    - id: "PLM-R3"
      severity: "medium"
      note: "Duplicate lifecycle controls in dashboard and editor drift."
      mitigation: "Extract shared display helpers or centralize copy/status mapping; keep one publish contract."
    - id: "PLM-R4"
      severity: "medium"
      note: "Compatibility route may be over-promoted."
      mitigation: "Canonical URL is primary; /r/[slug] is labelled compatibility only."
    - id: "PLM-R5"
      severity: "medium"
      note: "Concurrent role-inheritance work may touch resume API guards."
      mitigation: "Sequence backend changes carefully; avoid combining capability migration with link-management UI."
  doc_updates_needed_after_implementation:
    - file: "docs/action-plan.md"
      update: "Mark PLM tickets complete or record follow-up; update Phase D public-link item."
    - file: "docs/guides/deployment-qa.md"
      update: "Replace planned public-link QA with exact shipped manual steps and evidence requirements."
    - file: "docs/guides/saas-transition-work-plan.md"
      update: "Set Phase D/editor-adjacent public-link management status to complete if shipped."
    - file: ".codex/site-map-and-dependencies.md"
      update: "Document new editor-adjacent panel/component and any API route dependencies."
    - file: "docs/adr/0006-saved-version-language-versions-user-link-management-ux.md"
      update: "If ADR 0006 exists/lands, record final UX semantics for canonical/compatibility links."
  validation:
    planned:
      - "npm.cmd run lint"
      - "npm.cmd run typecheck"
      - "npm.cmd test"
    run:
      - cmd: "node -e \"const fs=require('fs'); const yaml=require('js-yaml'); yaml.load(fs.readFileSync('.codex/state.yaml','utf8')); console.log('state yaml ok')\""
        status: pass
        assertions:
          - "state.yaml parses successfully as YAML."
      - cmd: "npm.cmd run lint"
        status: pass
        assertions:
          - "ESLint completed with zero errors."
      - cmd: "npm.cmd run typecheck"
        status: pass
        assertions:
          - "TypeScript noEmit completed successfully."
      - cmd: "npm.cmd test"
        status: pass
        assertions:
          - "node:test suite passed: 136 tests."
    skipped_reason: null
  next:

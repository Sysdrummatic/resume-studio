    - id: "R4"
      severity: medium
      note: "Existing tests assert literal acceptedRoles arrays."
      mitigation: "Add capability tests first, then update source-string tests to assert behavior/security invariants."
    - id: "R5"
      severity: medium
      note: "Concurrent language-version worktree changes touch some scoped files."
      mitigation: "Keep PRs small, rebase/merge carefully, and avoid editing unrelated language modal code in role-inheritance PR1."
  rollback_plan:
    strategy: "Small PR rollback in reverse order; PR1 helpers are backward-compatible and can remain inert if later PRs are reverted."
    steps:
      - "If UI regression: revert PR4 only; server enforcement remains active."
      - "If resume guard regression: revert PR3; acceptedRoles fallback from PR1 can continue serving existing routes."
      - "If admin API regression: revert PR2; SQL/RPC target rules remain unchanged."
      - "If helper regression: revert PR1 and any dependent PRs together."
      - "If SQL helper migration is added and must be rolled back: apply a forward rollback migration that drops only newly introduced helper functions/policies; do not mutate historical migrations or data."
  immediate_tickets:

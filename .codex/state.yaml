language_modal_merge_architecture:
  agent: software_architect
  role: Architect
  task: "analyze_and_plan_language_modal_merge"
  status: ready_for_implementation
  requested_behavior:
    - "Language Version features move from the separate page workflow into Master Resume Editor modal workflow."
    - "First created CV defaults to English."
    - "After first master resume creation, editor shows EN language badge and a plus control to its right."
    - "Clicking plus opens add-language options."
    - "After successful add, a new language badge appears."
    - "Language badges render left-to-right in stable order."
  current_architecture:
    editor:
      file: "app/master-resume/editor-canvas-client.tsx"
      notes:
        - "Reads locale from ?locale and defaults to en."
        - "GET /api/resume/document?locale=<locale> ensures a resume_documents row and seeds from resume-en-template.yaml when absent."
        - "Header already has locale buttons from /api/resume/languages metadata."
    language_versions:
      files:
        - "app/language-versions/page.tsx"
        - "app/language-versions/language-versions-client.tsx"
      notes:
        - "Standalone authenticated page creates language metadata and document via POST /api/resume/languages."
        - "Client validates two-letter code, label, short label, duplicate code."
    api:
      file: "app/api/resume/languages/route.ts"
      notes:
        - "GET returns enabled language metadata or language/document pairs with withDocuments=true."
        - "POST upserts resume_languages and ensures a draft resume document by default."
        - "PATCH sets default locale across presets/variants."
    persistence:
      tables:
        - "resume_languages: global enabled language metadata, service-role upsert."
        - "resume_documents: owner locale documents, unique user_id+locale."
        - "resume_presets/resume_preset_variants: saved CV selections and publish default locale."
  proposed_design:
    component_boundaries:
      - component: "LanguageBadgeRail"
        owner: frontend_engineer
        location: "app/components or app/master-resume"
        responsibility: "Render existing document-backed language badges ordered by sort_order/code, show active state, and render plus icon immediately after the last badge."
      - component: "AddLanguageVersionModal"
        owner: frontend_engineer
        location: "app/components or app/master-resume"
        responsibility: "Own code/label/shortLabel form state, validation, POST /api/resume/languages, errors, saving state, and close behavior."
      - component: "useResumeLanguageVersions or local editor state reducer"
        owner: frontend_engineer
        location: "app/master-resume/editor-canvas-client.tsx or adjacent hook"
        responsibility: "Fetch /api/resume/languages?withDocuments=true, merge newly created language+document, keep active locale synchronized."
      - component: "EditorCanvasClient"
        owner: frontend_engineer
        location: "app/master-resume/editor-canvas-client.tsx"
        responsibility: "Keep YAML editing/publish/rollback behavior; delegate language management UI to extracted components."
    state_model:
      server_initial:
        - "No change required for the page server component initially; client can load language versions after hydration."
        - "Optional improvement: MasterResumePage may fetch initial language versions server-side later to avoid badge loading flicker."
      client_state:
        activeLocale: "ResumeLocale, initialized from searchParams locale or en."
        languageVersions: "Array<ResumeLanguageRow & { document: ResumeDocumentRow | null }>, fetched with withDocuments=true."
        isLanguageModalOpen: "boolean."
        addLanguageForm: "{ code, label, shortLabel, isSaving, error } held inside modal."
      ordering:
        - "Badge list should include document-backed languages only."
        - "Sort by resume_languages.sort_order asc, then code asc."
        - "Ensure en appears first by seeded sort_order=10; do not hardcode EN except as fallback if metadata is temporarily absent."
      navigation:
        - "Click existing badge switches active locale in-place via current loadLocaleDocument path."
        - "After adding a language, append/merge returned language+document, close modal, and optionally switch to the new locale only if product confirms; default recommended behavior is stay on current locale and show the new badge."
  data_contract_implications:
    yaml:
      - "No YAML shape change required."
      - "New language documents currently seed from public/data/private/resume-en-template.yaml; this satisfies first-CV-English but creates untranslated starter content for non-EN until edited."
      - "If future duplicate-from-source is added, it should be explicit and still pass validate_resume_document_yaml."
    persistence:
      - "No migration required for the modal merge."
      - "Existing unique resume_documents(user_id, locale) prevents duplicate documents."
      - "Existing resume_languages.sort_order controls left-to-right badge order."
      - "Default first CV is already enforced by editor default locale en and /api/resume/document ensure behavior."
    api:
      - "Reuse GET/POST /api/resume/languages."
      - "Prefer withDocuments=true for the editor badge rail so badges represent actual user documents, not every globally enabled language."
      - "No service-role expansion; POST still validates input and creates owner-scoped document through access-token writes."
    migration_risk:
      level: low
      notes:
        - "Schema is already present."
        - "Main risk is product confusion between global language metadata and per-user language versions."
        - "Avoid deleting standalone /language-versions route in the same implementation unless PM confirms route deprecation."
  security_risk_analysis:
    high_risk_boundaries:
      - "Auth/session: editor and language APIs remain authenticated."
      - "Service-role: upsertResumeLanguage uses service-role for global metadata; implementation should not expand payload fields or expose disabled languages for mutation."
      - "PublicShare: modal must not publish or expose a new language; publish remains explicit Saved Version workflow."
    mitigations:
      - "Keep API authorization unchanged."
      - "Do not add public link changes in FE merge."
      - "Do not auto-set newly added language as published/default unless user explicitly chooses that existing action."
  edge_cases:
    - "No document exists: /master-resume should still default to en and GET /api/resume/document?locale=en should create the first master resume."
    - "Language metadata exists but document missing: badge rail should hide it or show only after ensure document succeeds; modal POST returns document."
    - "Duplicate language code: client blocks and server returns existing metadata; UI should surface duplicate as non-destructive."
    - "Invalid locale such as en-US or 123: normalize/validate to two-letter lowercase, show deterministic error."
    - "API creates metadata but document ensure fails: show error and do not add badge unless document is present."
    - "Current editor has unsaved YAML changes and user clicks another badge: implementation should warn or disable switching while busy; current code only gates busy/loading."
    - "New language badge order after add: re-sort by sort_order/code before render."
    - "Published CVs: adding a draft language must not appear in public language switcher until selected and published."
    - "Recruiter role can currently access document/language POST; confirm this remains intentional before changing auth scopes."
  acceptance_criteria:
    - "Opening /master-resume with no locale query loads/creates EN document."
    - "After EN document exists, header shows EN badge followed immediately by plus icon."
    - "Plus opens accessible modal with code, language name, and short label inputs."
    - "Valid add-language submission calls POST /api/resume/languages with createDocument true."
    - "Successful add closes modal or shows success, and the new badge appears without full page reload."
    - "Badges render left-to-right by sort_order then code, with EN first for seeded data."
    - "Clicking a badge loads that locale in the existing editor without changing YAML contract."
    - "Draft added languages are not publicly visible until explicit publish flow selects them."
    - "Existing dashboard Saved Version publish language selection still works."
    - "Lint, typecheck, and targeted node tests pass."
  implementation_plan:
    frontend_engineer:
      owns:
        - "app/master-resume/editor-canvas-client.tsx"
        - "app/components/** or new app/master-resume/* language components"
        - "app/globals.css"
        - "app/layout.tsx if nav de-emphasis/removal is approved"
      tasks:
        - "Extract DEFAULT_LABELS/normalizeCode/normalizeShortLabel/form validation from LanguageVersionsClient into reusable module or component."
        - "Change editor language fetch to /api/resume/languages?withDocuments=true and store document-aware language versions."
        - "Render document-backed badges and plus icon in editor header; preserve existing button visual language."
        - "Implement modal using existing dashboard-modal/button/status styles or a shared modal component."
        - "On successful add, merge returned language+document and re-sort badges."
        - "Do not remove standalone /language-versions route unless PM explicitly scopes it."
    backend_engineer:
      owns:
        - "app/api/resume/languages/route.ts"
        - "app/lib/resume-server.ts"
      tasks:
        - "Review whether POST should return 409 for duplicate per-user language versions instead of silently returning existing global metadata."
        - "Ensure POST failure semantics distinguish metadata save failure from document ensure failure if FE needs precise modal errors."
        - "Confirm recruiter role access is intentional for language document creation."
      default_recommendation: "No backend change for first implementation unless tests expose ambiguous duplicate/failure behavior."
    test_engineer:
      owns:
        - "tests/language-versions-interface.test.mjs"
        - "tests/master-resume-editor-language-modal.test.mjs"
        - "tests/dashboard-presets.test.mjs if copy changes affect existing assertions"
      tasks:
        - "Update tests from standalone page expectation to modal-in-editor expectation, while keeping API contract coverage."
        - "Assert editor contains plus/add-language modal trigger and POST /api/resume/languages."
        - "Assert editor defaults locale state to en and requests /api/resume/document?locale=<locale>."
        - "Assert badge sorting uses sort_order/code or an explicit sort helper."
        - "Run npm.cmd run lint, npm.cmd run typecheck, npm.cmd test."
  next_trigger:
    REQ: frontend_engineer
    CMD: "implement_language_modal_shell"
    CTX:
      ref: ".codex/state.yaml#language_modal_merge_architecture"
      scope:
        - "app/master-resume/editor-canvas-client.tsx"
        - "app/components/**"
        - "app/globals.css"
    LMT:
      - "security-first"
      - "small-safe-reversible"
      - "preserve-existing-design-system"
adr_backlog:
  agent: software_architect
  task: "Post-PR4 ADR recommendations"
  status: proposed
  source:
    - "docs/adr/0001-cv-publication-model.md"
    - "docs/action-plan.md"
    - "docs/guides/saas-transition-work-plan.md"
    - ".codex/site-map-and-dependencies.md"
  current_rollout:
    - "ADR 0001 is accepted and implemented through PR4."
    - "Canonical public route is /{person-slug}/{public-id}."
    - "/r/[slug] is compatibility-only and redirects/resolves during migration."
    - "Publish/unpublish use transactional RPC and snapshot-backed Public Links."
  recommended_order:
    - id: "ADR 0002"
      title: "OpenCV YAML Public Contract And Schema Evolution"
      priority: 1
      decision_scope:
        - "Versioned YAML contract emitted by publish."
        - "Snapshot immutability and explicit historical schema migrations."
        - "Validation boundary between drafts, Saved Versions, and Published CV snapshots."
      risk: high
      contracts:
        - "Published CV snapshots must record schema and OpenCV contract versions."
        - "Public rendering must not infer missing public fields from private drafts."
    - id: "ADR 0003"
      title: "Privacy-First Admin And Staff Data Access"
      priority: 2
      decision_scope:
        - "Admin/manager metadata-only defaults."
        - "Audit/event visibility versus CV content visibility."
        - "Future recruiter access as explicit consent-scoped access."
      risk: high
      contracts:
        - "Staff roles must not gain ambient read access to CV YAML/content."
        - "Privileged reads and writes must remain audit logged."
    - id: "ADR 0004"
      title: "Public Route Compatibility And Deprecation Policy"
      priority: 3
      decision_scope:
        - "Compatibility behavior for /r/[slug]."
        - "Canonical redirect timing, deprecation gates, and rollback."
        - "Legacy URL observability before removal."
      risk: medium
      contracts:
        - "/r/[slug] remains non-canonical while migration evidence is collected."
        - "Canonical route remains /{person-slug}/{public-id}."
    - id: "ADR 0005"
      title: "SEO/AEO, Structured Data, Sitemap, And Robots Policy"
      priority: 4
      decision_scope:
        - "JSON-LD eligibility and content source."
        - "Sitemap inclusion rules."
        - "Robots, canonical, hreflang, OpenGraph, and language fallback policy."
      risk: medium
      contracts:
        - "Indexing is explicit user opt-in per active Public Link."
        - "Revoked, inactive, missing, or private links are excluded and noindex."
    - id: "ADR 0006"
      title: "Saved Version, Language Versions, And User Link Management UX"
      priority: 5
      decision_scope:
        - "Product naming from preset to Saved Version."
        - "Language Version selection and default-locale ownership."
        - "User panel link lifecycle actions and copy."
      risk: medium
      contracts:
        - "UI terms must not imply drafts are public."
        - "Publish uses explicit selected language set only."
    - id: "ADR 0007"
      title: "Publication Analytics, View Counting, And Audit Retention"
      priority: 6
      decision_scope:
        - "View count semantics."
        - "Privacy-preserving analytics for users and admins."
        - "Retention, aggregation, and bot filtering."
      risk: medium
      contracts:
        - "Analytics must not expose private CV content."
        - "User-facing metrics and admin metrics must have separate access rules."
    - id: "ADR 0008"
      title: "OpenCV Public API And Export Surface"
      priority: 7
      decision_scope:
        - "Future machine-readable OpenCV YAML endpoint or download."
        - "Caching, rate limiting, and content negotiation."
        - "Compatibility with public rendered CV pages."
      risk: low
      contracts:
        - "Exports must read Published CV snapshots only."
        - "Public API exposure follows Public Link active/indexing/privacy state."

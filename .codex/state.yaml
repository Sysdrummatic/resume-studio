        - "Open and Copy actions render only when a published canonical link exists."
        - "Private/unpublished rows expose no copyable public URL."
        - "Empty, loading, and error states are deterministic and accessible."
        - "No backend, RLS, migration, public resolver, or resume_public_links direct client access is added."
      validation:
        targeted:
          - "node --test tests/dashboard-presets.test.mjs tests/adr-0006-saved-version-ux-contract.test.mjs"
        required:
          - "npm.cmd run lint"
          - "npm.cmd run typecheck"
      next_on_pass: "T2"
      rollback: "Revert editor panel/component/tests; dashboard remains authoritative."
    - id: "T2"
      title: "Test lock for read-only panel"
      agent: test_engineer
      why: "Owns regression assertions and can keep tests behavior-focused instead of tying frontend to brittle implementation details."
      status: ready_after_t1
      dor:
        - "T1 implementation shape is available."
        - "Panel labels and copy/open affordances are final enough to assert."
      dod:
        - "Tests assert editor panel exists."
        - "Tests assert canonical-first display/copy behavior and compatibility secondary behavior."
        - "Tests assert private no-link state."
        - "Tests assert frontend does not query resume_public_links directly."
        - "Snapshot-backed public-route contract tests remain green."
      validation:
        targeted:
          - "node --test tests/dashboard-presets.test.mjs tests/adr-0006-saved-version-ux-contract.test.mjs"
          - "node --test tests/cv-publication-runtime-contract.test.mjs tests/cv-public-publicid-route.test.mjs tests/cv-public-compatibility-route.test.mjs"
        required:
          - "npm.cmd test"
      next_on_pass: "T3"
      rollback: "Revert or narrow tests if T1 is reverted."
    - id: "T3"
      title: "Frontend publish/unpublish controls from editor panel"
      agent: frontend_engineer
      why: "Owns client workflow, modal extraction/reuse, state refresh, and dashboard/editor terminology parity."
      status: ready_after_t2
      dor:
        - "T1 and T2 are green."
        - "Dashboard publish modal contract remains stable."
        - "Selected languages/default locale/indexing data needed for publish is available from existing frontend state or owner APIs."
      dod:
        - "Editor panel can publish through POST /api/resume/presets/[presetId]/publish only."
        - "Publish requires selectedLocales, defaultLocale, and allowIndexing confirmation."
        - "Editor panel can unpublish through POST /api/resume/presets/[presetId]/unpublish only."
        - "Unpublish never deletes the Saved Version."
        - "Local Saved Version/Public Link state refreshes after publish/unpublish."
        - "Master Resume document save/revision wording remains distinct from Published CV/Public Link lifecycle wording."
        - "No arbitrary userId/publicLinkId client parameter is introduced."
      validation:
        targeted:
          - "node --test tests/dashboard-presets.test.mjs tests/adr-0006-saved-version-ux-contract.test.mjs"
          - "node --test tests/cv-publication-runtime-contract.test.mjs tests/cv-publication-rpc-contract.test.mjs"
        required:
          - "npm.cmd run lint"
          - "npm.cmd run typecheck"
      next_on_pass: "T5 unless T4 is triggered"
      rollback: "Revert editor mutation controls; T1 read-only panel may remain."
    - id: "T4"
      title: "Conditional backend contract/capability alignment"
      agent: backend_engineer
      why: "Owns API routes, auth guards, resume-server contracts, and owner-scoped publication invariants."
      status: conditional_deferred
      dor:
        - "T1/T3 finds a real missing owner-scoped field or status ambiguity, or role-inheritance rollout reaches resume API guard migration."
        - "Exact backend scope is documented before edits start."
      dod:
        - "Preset API responses remain actor.userId scoped."
        - "Only necessary link metadata is exposed."
        - "No private YAML/content is exposed."
        - "No RLS weakening, service-role expansion, migration, or public resolver change."
        - "If guard migration is in scope, preset APIs use resume.preset.*_own capabilities while preserving current behavior."
      validation:
        targeted:
          - "node --test tests/cv-publication-runtime-contract.test.mjs tests/privacy-first-admin-access-contract.test.mjs tests/role-inheritance-rbac.test.mjs"
        required:
          - "npm.cmd run typecheck"
      next_on_pass: "T5"
      rollback: "Revert backend/test commit; dashboard and T1 frontend fallback remain."
    - id: "T5"
      title: "Full verification and deployment QA update"
      agent: test_engineer
      why: "Owns final automated gates, manual QA matrix, and regression evidence across frontend/backend surfaces."
      status: ready_after_t3_and_optional_t4
      dor:
        - "T3 is complete."
        - "T4 is complete or explicitly skipped as not needed."
      dod:
        - "Full validation evidence is recorded."
        - "Manual QA covers private, published, copy/open, publish, unpublish, republish, draft-edit-after-publish, canonical route, and compatibility route."
        - "Deployment QA checklist reflects the shipped behavior."
      validation:
        required:
          - "npm.cmd run lint"
          - "npm.cmd run typecheck"
          - "npm.cmd test"
        conditional:
          - "npm.cmd run build if Next route boundaries or metadata are touched."
      next_on_pass: "T6"
      rollback: "Docs/tests-only rollback if implementation PRs are reverted."
    - id: "T6"
      title: "PM closeout"
      agent: project_manager
      why: "Owns release status, sequencing state, checklist closure, residual-risk recording, and next-agent trigger."
      status: ready_after_t5
      dor:
        - "T5 automated and manual evidence is available."
      dod:
        - "docs/action-plan.md marks the item complete or records scoped follow-up."
        - "docs/guides/deployment-qa.md and docs/guides/saas-transition-work-plan.md match shipped behavior."
        - ".codex/state.yaml records validation, residual risks, rollback, and next trigger."
      validation:
        required:
          - "state.yaml YAML parse"
          - "docs diff review"
          - "default validation evidence linked from state.yaml"
      next_on_pass: "release_or_next_PM_prioritized_work"
      rollback: "Docs/state-only rollback."
  parallelization:
    can_run_parallel:
      - "T1 with advisory ui_ux_designer review of panel placement/copy; advisor should not edit unless explicitly asked."
      - "T2 test-plan drafting can overlap with late T1, but final assertions should wait for stable implementation."
      - "T4 can overlap with T3 only when a precise backend contract/capability task is confirmed and file ownership remains disjoint."
    sequential:

role_inheritance_rollout_package:
  agent: project_manager
  role: PM
  task: "sequence_role_inheritance_rollout"
  status: ready_for_backend_pr1
  source_refs:
    - ".codex/state.yaml#role_inheritance_model"
    - ".codex/instructions.md"
    - ".codex/site-map-and-dependencies.md"
    - ".codex/checklists.md"
    - ".codex/task-checklists.md"
    - "docs/guides/phase-c-auth-rbac-admin.md"
    - "docs/guides/privacy-first-admin-access-policy.md"
    - "docs/action-plan.md"
  preserved_contracts:
    - "profiles.role remains flat: admin, manager, user, recruiter."
    - "user is the base capability set."
    - "manager inherits user only."
    - "recruiter inherits user only."
    - "admin inherits manager and recruiter, therefore also user."
    - "Admin inheritance of recruiter is capability composition only; it does not create recruiter preview/content access."
    - "Private resume content remains owner-only; no staff, manager, admin, or recruiter ambient read of other users' yaml_content/revisions/draft selections."
  scope:
    in:
      - "TypeScript role/capability helpers."
      - "Backward-compatible auth guard option for capabilities."
      - "Admin API guard migration from direct role arrays to capabilities."
      - "Owner resume API guard migration to owner-only capabilities."
      - "Recruiter parity with user for own resume/language routes."
      - "Admin/account UI gates aligned to shared helpers."
      - "Focused regression tests and docs updates."
    out:
      - "Changing persisted role values or profile rows."
      - "Broadening Supabase RLS over private resume content."
      - "Adding recruiter consent/preview model."
      - "Changing public resume snapshot behavior."
      - "Refactoring unrelated auth/session or dashboard code."
  sequence:
    - order: 1
      id: "PR1"
      owner: backend_engineer
      cmd: "impl_role_capability_helpers_pr1"
      scope:
        - "app/lib/rbac.ts"
        - "app/lib/auth-request.ts"
        - "app/lib/auth-server.ts"
        - "app/lib/auth-types.ts"
        - "tests/**"
      deliverable: "Capability constants/helpers, inherited-role tests, and requireRequestActor capability overload while preserving acceptedRoles behavior."
      gates:
        - "No route behavior changes except internal helper compatibility."
        - "Tests prove inheritance matrix and denied content capability."
      rollback: "Revert helper/test commit; existing direct acceptedRoles guards remain active."
    - order: 2
      id: "PR2"
      owner: backend_engineer
      cmd: "migrate_admin_api_guards_pr2"
      scope:
        - "app/api/admin/users/route.ts"
        - "app/api/admin/users/[userId]/route.ts"
        - "app/lib/rbac.ts"
        - "tests/privacy-first-admin-access-contract.test.mjs"
        - "tests/adr-0007-publication-analytics-audit-policy.test.mjs"
      deliverable: "Admin list/update/delete use admin.* capabilities plus target-aware helpers; manager remains limited to self plus user/recruiter."
      gates:
        - "Recruiter is still denied admin area/API."
        - "Admin APIs remain metadata-only and do not import resume-server or select yaml_content."
      rollback: "Restore acceptedRoles admin guards and previous target checks."
    - order: 3
      id: "PR3"
      owner: backend_engineer
      cmd: "migrate_owner_resume_guards_pr3"
      scope:
        - "app/api/resume/document/route.ts"
        - "app/api/resume/draft/route.ts"
        - "app/api/resume/publish/route.ts"
        - "app/api/resume/rollback/route.ts"
        - "app/api/resume/presets/**"
        - "app/api/resume/languages/route.ts"
        - "tests/language-versions-interface.test.mjs"
        - "tests/**"
      deliverable: "Resume and language APIs use own-resource capabilities; recruiter receives user-equivalent own resume/language behavior."
      gates:
        - "Actor userId remains the only owner key passed to resume server functions."
        - "No route accepts target user id for private resume content."
        - "Public routes remain snapshot-only and unauthenticated."
      rollback: "Revert resume route guard changes; PR1 helper remains inert."
    - order: 4
      id: "PR4"
      owner: frontend_engineer
      cmd: "impl_role_capability_ui_gates_pr4"
      scope:
        - "app/components/account-menu.tsx"
        - "app/admin/page.tsx"
        - "app/admin/admin-users-client.tsx"
        - "tests/account-menu-profile-modal.test.mjs"
        - "tests/header-account-menu.test.mjs"
        - "tests/**"
      deliverable: "Account menu and admin disabled states use shared capability/target policy; manager sees User management link."
      gates:
        - "UI gates mirror server rules but are not the enforcement boundary."
        - "Manager cannot select manager/admin targets or role options."
      rollback: "Revert UI/tests only; server authorization remains authoritative."
    - order: 5
      id: "PR5"
      owner: backend_engineer
      cmd: "sql_alignment_decision_pr5"
      scope:
        - "supabase/migrations/**"
        - "docs/guides/phase-c-auth-rbac-admin.md"
        - "docs/guides/privacy-first-admin-access-policy.md"
        - "tests/phase-c-sql-migration.test.js"
        - "tests/privacy-first-admin-access-contract.test.mjs"
      deliverable: "Either forward-only has_role/has_capability SQL helper migration or documented no-op decision that existing target-aware SQL helpers are sufficient."
      gates:
        - "No destructive migration."
        - "Owner-only resume RLS from 20260509_privacy_first_admin_access.sql remains unchanged."
      rollback: "If migration is added, revert with a forward rollback migration that drops only new helper functions; no data rollback."
    - order: 6
      id: "PR6"
      owner: test_engineer
      cmd: "role_inheritance_full_verification_pr6"
      scope:
        - "tests/**"
        - "docs/**"
        - ".codex/state.yaml"
      deliverable: "Consolidated regression pass, brittle literal-role tests updated, docs synced, validation evidence recorded."
      gates:
        - "Default validation passes."
        - "Manual QA checklist is attached for admin, manager, recruiter, and user."
      rollback: "Docs/tests-only revert if no production code changes remain pending."
  backlog_by_risk:
    high:
      - file: "app/lib/rbac.ts"
        owner: backend_engineer
        changes:
          - "Add AppCapability union and ROLE_INHERITS/ROLE_CAPABILITIES maps."
          - "Add getEffectiveRoles, hasRole, hasCapability, canAccessAdminArea via capability, and target-aware canAssignRole/canDeleteTarget wrappers."
          - "Explicitly deny resume.content.read_other for every current role."
      - file: "app/lib/auth-request.ts"
        owner: backend_engineer
        changes:
          - "Add backward-compatible guard options: acceptedRoles legacy plus anyCapability/allCapabilities."
          - "Keep email verification and inactive-account checks before capability checks."
      - file: "app/api/admin/users/route.ts"
        owner: backend_engineer
        changes:
          - "Replace requireRequestActor([admin, manager]) with admin.users.read capability."
          - "Keep manager response filter to self plus user/recruiter."
          - "Keep metadata-only response."
      - file: "app/api/admin/users/[userId]/route.ts"
        owner: backend_engineer
        changes:
          - "Use mutation-specific admin.users.role_write/status_write/delete capabilities plus target-aware helpers."
          - "Preserve manager self-privilege and manager/admin target restrictions."
          - "Preserve RPC and audit behavior."
      - file: "supabase/migrations/**"
        owner: backend_engineer
        changes:
          - "Add forward-only helper migration only if required after API migration."
          - "Never modify already-applied migrations for production-like environments."
          - "Do not broaden owner-only resume content RLS."
    medium:
      - file: "app/api/resume/languages/route.ts"
        owner: backend_engineer
        changes:
          - "Align recruiter with user for GET/PATCH/DELETE own language management unless product documents an exception."
          - "Ensure POST createDocument remains owner-scoped."
      - file: "app/api/resume/document/route.ts"
        owner: backend_engineer
        changes:
          - "Use resume.document.read_own/write_own capability and actor.userId only."
      - file: "app/api/resume/draft/route.ts"
        owner: backend_engineer
        changes:
          - "Use resume.document.write_own capability."
      - file: "app/api/resume/publish/route.ts"
        owner: backend_engineer
        changes:
          - "Use resume.preset.publish_own capability."
      - file: "app/api/resume/rollback/route.ts"
        owner: backend_engineer
        changes:
          - "Use resume.revision.rollback_own capability."
      - file: "app/api/resume/presets/**"
        owner: backend_engineer
        changes:
          - "Use resume.preset read/write/publish/unpublish own capabilities."
      - file: "app/lib/auth-server.ts"
        owner: backend_engineer
        changes:
          - "Route requireStaffActor through canAccessAdminArea/hasCapability."
      - file: "app/admin/page.tsx"
        owner: frontend_engineer
        changes:
          - "Use shared target filtering/policy helpers where server-rendered initial manager list is filtered."
      - file: "app/admin/admin-users-client.tsx"
        owner: frontend_engineer
        changes:
          - "Use shared role option and target manageability helpers for disabled controls."
      - file: "app/components/account-menu.tsx"
        owner: frontend_engineer
        changes:
          - "Show User management for admin and manager via shared canAccessAdminArea helper."
    low:
      - file: "docs/action-plan.md"
        owner: project_manager
        changes:
          - "Track rollout sequence, DoD, rollback, and triggers."
      - file: "docs/guides/phase-c-auth-rbac-admin.md"
        owner: backend_engineer
        changes:
          - "Document inherited capabilities after implementation."
      - file: "docs/guides/privacy-first-admin-access-policy.md"
        owner: backend_engineer
        changes:
          - "Clarify recruiter inheritance is own-account only and not staff visibility."
      - file: "tests/**"
        owner: test_engineer
        changes:
          - "Replace brittle literal acceptedRoles assertions with capability/behavior assertions."
  definition_of_done:
    automated:
      - "npm.cmd run lint passes."
      - "npm.cmd run typecheck passes."
      - "npm.cmd test passes."
    behavioral:
      - "hasRole(admin, manager/recruiter/user), hasRole(manager, user), and hasRole(recruiter, user) are true."
      - "hasRole(manager, recruiter) and hasRole(recruiter, manager) are false."
      - "Admin and manager can access /admin; user and recruiter cannot."
      - "Manager can manage only user/recruiter targets and cannot modify own privileges."
      - "Admin can manage all current roles."
      - "User, recruiter, manager, and admin can only read/write their own private resume content through resume APIs."
      - "Admin/user management APIs expose metadata only."
      - "Public CV routes continue to render active snapshot-backed Public Links only."
    documentation:
      - "docs/action-plan.md and role guides reflect the inherited capability model."
      - "Any SQL no-op/migration decision is recorded with rollback notes."
  verification_matrix:
    commands:
      - cmd: "npm.cmd run lint"
        owner: test_engineer
        expected_evidence:
          - "ESLint/Next lint completes with zero errors."
      - cmd: "npm.cmd run typecheck"
        owner: test_engineer
        expected_evidence:
          - "TypeScript noEmit completes successfully."
      - cmd: "npm.cmd test"
        owner: test_engineer
        expected_evidence:
          - "node:test suite passes."
          - "Role inheritance, admin metadata-only, recruiter owner parity, and owner-only RLS contract tests are green."
      - cmd: "npm.cmd run ci"
        owner: test_engineer
        required: false
        when: "Before release candidate or after SQL migration is added."
        expected_evidence:
          - "CI-style aggregate check is green."
    targeted_tests:
      - file: "tests/role-inheritance-rbac.test.mjs"
        expected_evidence:
          - "Effective role expansion and capabilities match the matrix."
          - "resume.content.read_other remains false for all roles."
      - file: "tests/privacy-first-admin-access-contract.test.mjs"
        expected_evidence:
          - "Admin APIs do not import resume-server, resume_documents, or yaml_content."
          - "Recruiter is not accepted for admin APIs."
      - file: "tests/language-versions-interface.test.mjs"
        expected_evidence:
          - "Recruiter parity with user for own language management is implemented or documented exception is asserted."
      - file: "tests/phase-c-sql-migration.test.js"
        expected_evidence:
          - "SQL helpers/RPC remain aligned with admin/manager target rules."
      - file: "tests/account-menu-profile-modal.test.mjs"
        expected_evidence:
          - "User management menu item is visible for admin and manager only."
    manual_qa:
      - actor: "admin"
        checks:
          - "Can open /admin."
          - "Can list users and change roles/status/delete per current admin rules."
          - "Cannot read another user's private resume YAML through owner resume APIs."
      - actor: "manager"
        checks:
          - "Can open /admin and sees User management in account menu."
          - "Sees self plus user/recruiter targets only."
          - "Cannot manage manager/admin or own privileges."
      - actor: "recruiter"
        checks:
          - "Cannot open /admin."
          - "Can use own dashboard/resume/language flows matching user parity."
          - "Cannot read another user's private resume content."
      - actor: "user"
        checks:
          - "Cannot open /admin."
          - "Own resume document/preset/publish/rollback flows still work."
  risks:
    - id: "R1"

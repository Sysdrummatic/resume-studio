<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCVHub · Public resume</title>
    <meta name="robots" content="noindex,nofollow" id="robots-meta" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/landing.css" />
    <link rel="stylesheet" href="../styles/auth.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="../index.html" aria-label="OpenCVHub home">OpenCVHub</a>
      <nav class="topbar__actions" aria-label="Primary">
        <a class="btn btn--ghost" href="../login.html">Sign in</a>
      </nav>
    </header>
    <main>
      <section class="auth-shell" aria-labelledby="public-title">
        <h1 id="public-title">Public resume</h1>
        <p id="public-status" class="auth-status" role="status" aria-live="polite">Loading resume...</p>
        <article id="public-content" class="public-resume" hidden></article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../scripts/auth-config.js"></script>
    <script src="../scripts/public-resume.js"></script>
  </body>
</html>
